<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sudoku</title>
    <link rel="stylesheet" href="sudoku.css" />
</head>
<body>
    <div class="wrapper-main">
        <h1>Sudoku</h1>

        <div class="controls-row">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="1">Easy</option>
                <option value="2" selected>Medium</option>
                <option value="3">Hard</option>
            </select>

            <button id="startBtn">Start Game</button>
            <button id="undoBtn" title="Undo last user move">Undo Move</button>

            <button id="solveBtn">Solve Puzzle</button>

            <label for="solverType">Solve with:</label>
            <select id="solverType">
                <option value="backtracking">Backtracking (Recommended)</option>
                <option value="random">Random Fill (Experimental)</option>
            </select>
        </div>

        <div class="controls-row">
            <label><input type="checkbox" id="animateCheckbox" /> Animate Solve</label>

            <label for="speedRange">Speed:</label>
            <input id="speedRange" type="range" min="25" max="800" step="25" value="150" />
            <span id="speedValue">150ms</span>
        </div>

        <div id="sudokuBoard" class="board" aria-label="Sudoku board"></div>
    </div>

    <script src="sudoku.js"></script>
</body>
</html>
