<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sudoku</title>
    <link rel="stylesheet" href="sudoku.css" />
</head>
<body>
    <div class="wrapper-main">
        <h1>Sudoku</h1>

        <div style="margin-bottom:8px;">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="1">Easy</option>
                <option value="2">Medium</option>
                <option value="3">Hard</option>
            </select>

            <button id="startBtn">Start Game</button>

            <!-- Solver UI -->
            <button id="solveBtn">Solve Puzzle</button>

            <label for="solverType" style="margin-left:10px;">Solve with:</label>
            <select id="solverType">
                <option value="backtracking">Backtracking (Recommended)</option>
                <option value="random">Random Fill (Experimental)</option>
            </select>
        </div>

        <div id="sudokuBoard" class="board" aria-label="Sudoku board"></div>
    </div>

    <script src="sudoku.js"></script>
</body>
</html>
